name: Evaluation code checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scikit-learn==1.7.2
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q research examples tests
